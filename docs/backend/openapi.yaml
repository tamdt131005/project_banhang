openapi: 3.1.0
info:
  title: Tâm Đặng Admin API
  version: 0.6.0
  description: Source-of-truth transport contract including SPEC-BANNER-001 v0.4.
servers:
  - url: http://localhost:4000/api
security:
  - accessCookie: []
components:
  securitySchemes:
    accessCookie: { type: apiKey, in: cookie, name: access_token }
  schemas:
    OrderStatus: { type: string, enum: [PENDING, CONFIRMED, SHIPPING, DELIVERED, CANCELLED] }
    PaymentStatus: { type: string, enum: [UNPAID, PAID, FAILED] }
    PaymentMethod: { type: string, enum: [COD, MOMO] }
    Role: { type: string, enum: [USER, STAFF, ADMIN] }
    StaffPermission: { type: string, enum: [DASHBOARD, ORDERS, INVENTORY, CATALOG, BANNERS, CUSTOMERS, SUPPORT] }
    ConversationStatus: { type: string, enum: [AI, WAITING_ADMIN, LIVE, CLOSED] }
    MessageSender: { type: string, enum: [USER, AI, ADMIN, SYSTEM] }
    ActorType: { type: string, enum: [CUSTOMER, ADMIN, SYSTEM] }
    Pagination:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    Conversation:
      type: object
      required: [id, userId, assignedAdminId, status, createdAt, updatedAt, closedAt]
      properties:
        id: { type: integer }
        userId: { type: integer }
        assignedAdminId: { type: [integer, 'null'] }
        status: { $ref: '#/components/schemas/ConversationStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        closedAt: { type: [string, 'null'], format: date-time }
    ConversationParticipant:
      type: object
      required: [id, email, fullName]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        fullName: { type: string }
    AdminConversation:
      allOf:
        - $ref: '#/components/schemas/Conversation'
        - type: object
          required: [user, assignedAdmin]
          properties:
            user: { $ref: '#/components/schemas/ConversationParticipant' }
            assignedAdmin:
              oneOf:
                - $ref: '#/components/schemas/ConversationParticipant'
                - type: 'null'
    CustomerConversationItem:
      allOf:
        - $ref: '#/components/schemas/Conversation'
        - type: object
          required: [assignedAdmin, messages]
          properties:
            assignedAdmin:
              oneOf:
                - $ref: '#/components/schemas/ConversationParticipant'
                - type: 'null'
            messages:
              type: array
              items:
                type: object
                required: [id, senderType, content, createdAt]
                properties:
                  id: { type: integer }
                  senderType: { $ref: '#/components/schemas/MessageSender' }
                  content: { type: string }
                  createdAt: { type: string, format: date-time }
    ChatMessage:
      type: object
      required: [id, conversationId, senderType, senderUserId, content, metadata, createdAt]
      properties:
        id: { type: integer }
        conversationId: { type: integer }
        senderType: { $ref: '#/components/schemas/MessageSender' }
        senderUserId: { type: [integer, 'null'] }
        content: { type: string }
        metadata: { type: [object, 'null'], additionalProperties: true }
        createdAt: { type: string, format: date-time }
    ChatProductCard:
      type: object
      additionalProperties: false
      required: [id, name, slug, price, stock, category, image, matchingVariants]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        price: { type: number }
        stock: { type: integer }
        category:
          type: object
          additionalProperties: false
          required: [id, name, slug]
          properties:
            id: { type: integer }
            name: { type: string }
            slug: { type: string }
        image:
          oneOf:
            - type: object
              additionalProperties: false
              required: [url, thumbUrl]
              properties:
                url: { type: string }
                thumbUrl: { type: string }
            - type: 'null'
        matchingVariants:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, size, color, available]
            properties:
              id: { type: integer }
              size: { type: string }
              color: { type: string }
              available: { type: boolean }
    ChatAIMessageMetadata:
      type: object
      additionalProperties: true
      properties:
        kind: { type: string, enum: [AI_RESPONSE, AI_ERROR] }
        products: { type: array, items: { $ref: '#/components/schemas/ChatProductCard' } }
        suggestions: { type: array, items: { type: string } }
        handoffRecommended: { type: boolean }
    ChatMessageInput:
      type: object
      additionalProperties: false
      required: [content]
      properties: { content: { type: string, minLength: 1, maxLength: 4000 } }
    Category:
      type: object
      required: [id, name, slug, sortOrder, productCount, children]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        sortOrder: { type: integer }
        productCount: { type: integer }
        children: { type: array, items: { $ref: '#/components/schemas/Category' } }
    CreateCategoryInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string }
        parentId: { type: [integer, 'null'] }
        sortOrder: { type: integer }
    BannerPlacement: { type: string, enum: [HOME_HERO] }
    Banner:
      type: object
      required: [id, name, imageUrl, altText, linkUrl, placement, sortOrder, isActive, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        imageUrl: { type: string }
        altText: { type: string }
        linkUrl: { type: [string, 'null'] }
        placement: { $ref: '#/components/schemas/BannerPlacement' }
        sortOrder: { type: integer, minimum: 0 }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UpdateBannerInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        altText: { type: string }
        linkUrl: { type: [string, 'null'] }
        placement: { $ref: '#/components/schemas/BannerPlacement' }
        sortOrder: { type: integer, minimum: 0 }
        isActive: { type: boolean }
    UpdateCategoryInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        parentId: { type: [integer, 'null'] }
        sortOrder: { type: integer }
    ProductImage:
      type: object
      required: [id, url, thumbUrl, sortOrder]
      properties:
        id: { type: integer }
        url: { type: string }
        thumbUrl: { type: string }
        sortOrder: { type: integer }
    ProductSummary:
      type: object
      required: [id, name, slug, price, stock, isActive, createdAt, category, images]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        price: { type: integer }
        stock: { type: integer }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        category:
          type: object
          required: [id, name, slug]
          properties: { id: { type: integer }, name: { type: string }, slug: { type: string } }
        images:
          type: array
          items:
            type: object
            required: [url, thumbUrl]
            properties: { url: { type: string }, thumbUrl: { type: string } }
    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductSummary'
        - type: object
          required: [description, variants]
          properties:
            description: { type: string }
            images: { type: array, items: { $ref: '#/components/schemas/ProductImage' } }
            variants:
              type: array
              items:
                type: object
                required: [id, size, color, stock]
                properties:
                  id: { type: integer }
                  size: { type: string }
                  color: { type: string }
                  stock: { type: integer }
    NewVariantInput:
      type: object
      additionalProperties: false
      required: [size, color, initialStock]
      properties:
        size: { type: string, maxLength: 20 }
        color: { type: string, maxLength: 50 }
        initialStock: { type: integer, minimum: 0, maximum: 100000 }
    ExistingVariantInput:
      type: object
      additionalProperties: false
      required: [id, size, color]
      properties:
        id: { type: integer, minimum: 1 }
        size: { type: string, maxLength: 20 }
        color: { type: string, maxLength: 50 }
    CreateProductInput:
      type: object
      additionalProperties: false
      required: [name, description, price, categoryId, variants]
      properties:
        name: { type: string }
        description: { type: string }
        price: { type: integer }
        categoryId: { type: integer }
        isActive: { type: boolean }
        variants: { type: array, minItems: 1, items: { $ref: '#/components/schemas/NewVariantInput' } }
    UpdateProductInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        description: { type: string }
        price: { type: integer }
        categoryId: { type: integer }
        isActive: { type: boolean }
        variants:
          type: array
          minItems: 1
          items:
            oneOf:
              - $ref: '#/components/schemas/NewVariantInput'
              - $ref: '#/components/schemas/ExistingVariantInput'
    OrderHistory:
      type: object
      required: [id, type, fromStatus, toStatus, actorType, actorUserId, reason, occurredAt, recordedAt]
      properties:
        id: { type: integer }
        type: { type: string, enum: [CREATED, TRANSITION, BASELINE] }
        fromStatus: { oneOf: [{ $ref: '#/components/schemas/OrderStatus' }, { type: 'null' }] }
        toStatus: { $ref: '#/components/schemas/OrderStatus' }
        actorType: { $ref: '#/components/schemas/ActorType' }
        actorUserId: { type: [integer, 'null'] }
        reason: { type: [string, 'null'] }
        occurredAt: { type: [string, 'null'], format: date-time }
        recordedAt: { type: string, format: date-time }
    OrderItem:
      type: object
      required: [id, productId, productName, productImage, size, color, unitPrice, quantity, lineTotal]
      properties:
        id: { type: integer }
        productId: { type: [integer, 'null'] }
        productName: { type: string }
        productImage: { type: [string, 'null'] }
        size: { type: [string, 'null'] }
        color: { type: [string, 'null'] }
        unitPrice: { type: integer }
        quantity: { type: integer }
        lineTotal: { type: integer }
    Order:
      type: object
      required: [id, code, status, paymentMethod, paymentStatus, subtotal, shippingFee, total, receiverName, receiverPhone, shippingLine1, shippingWard, shippingDistrict, shippingProvince, note, createdAt, items]
      properties:
        id: { type: integer }
        code: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        paymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        subtotal: { type: integer }
        shippingFee: { type: integer }
        total: { type: integer }
        receiverName: { type: string }
        receiverPhone: { type: string }
        shippingLine1: { type: string }
        shippingWard: { type: string }
        shippingDistrict: { type: string }
        shippingProvince: { type: string }
        note: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/OrderItem' } }
        statusHistory: { type: array, items: { $ref: '#/components/schemas/OrderHistory' } }
    AdminOrder:
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          required: [user]
          properties:
            user:
              type: object
              required: [id, email, fullName]
              properties: { id: { type: integer }, email: { type: string }, fullName: { type: string } }
    InventoryMovement:
      type: object
      required: [id, variantId, productNameSnapshot, sizeSnapshot, colorSnapshot, type, beforeStock, afterStock, delta, orderId, actorType, actorUserId, reason, operationKey, createdAt]
      properties:
        id: { type: integer }
        variantId: { type: [integer, 'null'] }
        productNameSnapshot: { type: string }
        sizeSnapshot: { type: string }
        colorSnapshot: { type: string }
        type: { type: string, enum: [BASELINE, INITIAL_STOCK, ORDER_RESERVED, ORDER_RESTORED, ADMIN_ADJUSTMENT, VARIANT_RETIRED] }
        beforeStock: { type: [integer, 'null'] }
        afterStock: { type: integer }
        delta: { type: [integer, 'null'] }
        orderId: { type: [integer, 'null'] }
        actorType: { $ref: '#/components/schemas/ActorType' }
        actorUserId: { type: [integer, 'null'] }
        reason: { type: [string, 'null'] }
        operationKey: { type: string }
        createdAt: { type: string, format: date-time }
    InventoryItem:
      type: object
      required: [id, size, color, stock, updatedAt, product]
      properties:
        id: { type: integer }
        size: { type: string }
        color: { type: string }
        stock: { type: integer }
        updatedAt: { type: string, format: date-time }
        product:
          type: object
          required: [id, name, slug, price, isActive, category, thumbUrl]
          properties:
            id: { type: integer }
            name: { type: string }
            slug: { type: string }
            price: { type: integer }
            isActive: { type: boolean }
            thumbUrl: { type: [string, 'null'] }
            category:
              type: object
              required: [id, name]
              properties: { id: { type: integer }, name: { type: string } }
    UserStaffAccess:
      type: object
      required: [id, role, permissions]
      properties:
        id: { type: integer }
        role: { type: string, enum: [USER, STAFF] }
        permissions: { type: array, items: { $ref: '#/components/schemas/StaffPermission' } }
    AdminUser:
      type: object
      required: [id, email, fullName, phone, avatarUrl, role, createdAt, _count]
      properties:
        id: { type: integer }
        email: { type: string }
        fullName: { type: string }
        phone: { type: [string, 'null'] }
        avatarUrl: { type: [string, 'null'] }
        role: { $ref: '#/components/schemas/Role' }
        createdAt: { type: string, format: date-time }
        _count:
          type: object
          required: [orders, addresses]
          properties: { orders: { type: integer }, addresses: { type: integer } }
    AdminUserDetail:
      allOf:
        - $ref: '#/components/schemas/AdminUser'
        - type: object
          required: [updatedAt, addresses, orders, stats]
          properties:
            updatedAt: { type: string, format: date-time }
            addresses:
              type: array
              items:
                type: object
                required: [id, fullName, phone, line1, ward, district, province, isDefault]
                properties:
                  id: { type: integer }
                  fullName: { type: string }
                  phone: { type: string }
                  line1: { type: string }
                  ward: { type: string }
                  district: { type: string }
                  province: { type: string }
                  isDefault: { type: boolean }
            orders:
              type: array
              items:
                type: object
                required: [id, code, status, total, createdAt]
                properties:
                  id: { type: integer }
                  code: { type: string }
                  status: { $ref: '#/components/schemas/OrderStatus' }
                  total: { type: integer }
                  createdAt: { type: string, format: date-time }
            stats:
              type: object
              required: [deliveredOrders, totalSpent]
              properties: { deliveredOrders: { type: integer }, totalSpent: { type: integer } }
    AdminStats:
      type: object
      required: [revenue, orders, catalog, stock, customers, series, topProducts, recentOrders, lowStockVariants]
      properties:
        revenue:
          type: object
          required: [delivered, inProgress, last7Days, previous7Days]
          properties: { delivered: { type: integer }, inProgress: { type: integer }, last7Days: { type: integer }, previous7Days: { type: integer } }
        orders:
          type: object
          required: [total, pending, confirmed, shipping, delivered, cancelled]
          properties: { total: { type: integer }, pending: { type: integer }, confirmed: { type: integer }, shipping: { type: integer }, delivered: { type: integer }, cancelled: { type: integer } }
        catalog:
          type: object
          required: [products, activeProducts, categories, variants]
          properties: { products: { type: integer }, activeProducts: { type: integer }, categories: { type: integer }, variants: { type: integer } }
        stock:
          type: object
          required: [units, low, out, threshold]
          properties: { units: { type: integer }, low: { type: integer }, out: { type: integer }, threshold: { type: integer } }
        customers:
          type: object
          required: [total, newLast7Days]
          properties: { total: { type: integer }, newLast7Days: { type: integer } }
        series:
          type: array
          items:
            type: object
            required: [date, orders, revenue]
            properties: { date: { type: string }, orders: { type: integer }, revenue: { type: integer } }
        topProducts:
          type: array
          items:
            type: object
            required: [productId, name, quantity, revenue]
            properties: { productId: { type: [integer, 'null'] }, name: { type: string }, quantity: { type: integer }, revenue: { type: integer } }
        recentOrders:
          type: array
          items:
            type: object
            required: [id, code, status, total, createdAt, user]
            properties:
              id: { type: integer }
              code: { type: string }
              status: { $ref: '#/components/schemas/OrderStatus' }
              total: { type: integer }
              createdAt: { type: string, format: date-time }
              user:
                type: object
                required: [fullName, email]
                properties: { fullName: { type: string }, email: { type: string } }
        lowStockVariants:
          type: array
          items:
            type: object
            required: [id, size, color, stock, productId, productName, thumbUrl]
            properties:
              id: { type: integer }
              size: { type: string }
              color: { type: string }
              stock: { type: integer }
              productId: { type: integer }
              productName: { type: string }
              thumbUrl: { type: [string, 'null'] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties: { code: { type: string }, message: { type: string }, details: {} }
  responses:
    Error: { description: Request failed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
paths:
  /banners:
    get:
      security: []
      operationId: listPublicBanners
      parameters: [{ name: placement, in: query, schema: { $ref: '#/components/schemas/BannerPlacement' } }]
      responses: { '200': { description: Active banners in display order, content: { application/json: { schema: { type: object, required: [banners], properties: { banners: { type: array, items: { $ref: '#/components/schemas/Banner' } } } } } } } }
  /chat/conversations:
    get:
      operationId: listCustomerChatConversations
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ConversationStatus' } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Customer ticket/conversation page with latest message snippet
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CustomerConversationItem' } }
                  pagination: { $ref: '#/components/schemas/Pagination' }
    post:
      operationId: createChatConversation
      responses:
        '201': { description: Conversation created, content: { application/json: { schema: { type: object, required: [conversation], properties: { conversation: { $ref: '#/components/schemas/Conversation' } } } } } }
  /chat/conversations/{id}/messages:
    get:
      operationId: listChatMessages
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }, { name: page, in: query, schema: { type: integer } }, { name: limit, in: query, schema: { type: integer } }]
      responses:
        '200': { description: Customer-owned message page, content: { application/json: { schema: { type: object, required: [messages, pagination], properties: { messages: { type: array, items: { $ref: '#/components/schemas/ChatMessage' } }, pagination: { $ref: '#/components/schemas/Pagination' } } } } } }
    post:
      operationId: sendChatMessage
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChatMessageInput' } } } }
      responses:
        '201': { description: 'User message committed; when AI is enabled, aiPending=true means an assistant response was safely queued after commit', content: { application/json: { schema: { type: object, required: [conversation, message], properties: { conversation: { $ref: '#/components/schemas/Conversation' }, message: { $ref: '#/components/schemas/ChatMessage' }, aiPending: { type: boolean } } } } } }
  /chat/conversations/{id}/request-admin:
    post:
      operationId: requestChatAdmin
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Human support requested or idempotently replayed, content: { application/json: { schema: { type: object, required: [conversation, message], properties: { conversation: { $ref: '#/components/schemas/Conversation' }, message: { $ref: '#/components/schemas/ChatMessage' } } } } } }
  /chat/conversations/{id}/close:
    post:
      operationId: closeChatConversation
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Customer conversation closed or idempotently replayed, content: { application/json: { schema: { type: object, required: [conversation, message], properties: { conversation: { $ref: '#/components/schemas/Conversation' }, message: { $ref: '#/components/schemas/ChatMessage' } } } } } }
  /admin/chat/conversations:
    get:
      operationId: listAdminChatConversations
      parameters: [{ name: status, in: query, schema: { $ref: '#/components/schemas/ConversationStatus' } }, { name: page, in: query, schema: { type: integer } }, { name: limit, in: query, schema: { type: integer } }]
      responses:
        '200': { description: Support queue page, content: { application/json: { schema: { type: object, required: [items, pagination], properties: { items: { type: array, items: { $ref: '#/components/schemas/AdminConversation' } }, pagination: { $ref: '#/components/schemas/Pagination' } } } } } }
  /admin/chat/conversations/{id}:
    get:
      operationId: getAdminChatConversation
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }, { name: page, in: query, schema: { type: integer } }, { name: limit, in: query, schema: { type: integer } }]
      responses:
        '200': { description: Conversation detail and message page, content: { application/json: { schema: { type: object, required: [conversation, messages, pagination], properties: { conversation: { $ref: '#/components/schemas/AdminConversation' }, messages: { type: array, items: { $ref: '#/components/schemas/ChatMessage' } }, pagination: { $ref: '#/components/schemas/Pagination' } } } } } }
  /admin/chat/conversations/{id}/accept:
    post:
      operationId: acceptAdminChatConversation
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Support conversation atomically accepted, content: { application/json: { schema: { type: object, required: [conversation, message], properties: { conversation: { $ref: '#/components/schemas/Conversation' }, message: { $ref: '#/components/schemas/ChatMessage' } } } } } }
  /admin/chat/conversations/{id}/messages:
    post:
      operationId: sendAdminChatMessage
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChatMessageInput' } } } }
      responses:
        '201': { description: Assigned-admin message committed, content: { application/json: { schema: { type: object, required: [conversation, message], properties: { conversation: { $ref: '#/components/schemas/Conversation' }, message: { $ref: '#/components/schemas/ChatMessage' } } } } } }
  /admin/chat/conversations/{id}/close:
    post:
      operationId: closeAdminChatConversation
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        '200': { description: Conversation closed or idempotently replayed, content: { application/json: { schema: { type: object, required: [conversation, message], properties: { conversation: { $ref: '#/components/schemas/Conversation' }, message: { $ref: '#/components/schemas/ChatMessage' } } } } } }
  /admin/stats:
    get:
      operationId: getAdminStats
      responses: { '200': { description: Dashboard statistics, content: { application/json: { schema: { $ref: '#/components/schemas/AdminStats' } } } } }
  /admin/inventory:
    get:
      operationId: listAdminInventory
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: categoryId, in: query, schema: { type: integer } }
        - { name: lowOnly, in: query, schema: { type: boolean } }
